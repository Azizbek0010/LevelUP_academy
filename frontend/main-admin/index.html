<!doctype html>
<html lang="ru" data-theme="levelup">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Private panel: every route is auth-gated. Never index. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <title>LevelUp — Main Admin</title>
    <!--
      Тема применяется ДО отрисовки — иначе при сохранённой тёмной теме страница
      мигнёт светлой на долю секунды (FOUC). Порядок: сохранённый выбор →
      системная настройка → светлая по умолчанию.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('lu-theme');
          if (t !== 'levelup' && t !== 'levelup-dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'levelup-dark'
              : 'levelup';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
