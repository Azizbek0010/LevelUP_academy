# Render Blueprint — LevelUp Academy backend (API + Worker, free-план).
# ⚠️ Free-веб засыпает через ~15 мин простоя (холодный старт ~30-50с).
#    Free-worker ТАКЖЕ засыпает через ~15 мин простоя.
#    BullMQ очереди (notifications, overdue, billing, due-soon) + Telegram bot = worker.
# БД/Redis/S3 — внешние (Neon/Upstash/Storj), подключаются через env ниже.
services:
  # ─── API (HTTP) ───
  - type: web
    # ⚠️ Имя должно совпадать с именем РЕАЛЬНОГО сервиса в Render, иначе весь этот
    # файл — фикция: Blueprint сопоставляет сервисы по имени и просто не находит,
    # что настраивать. До 04.08 здесь стояло `levelup-backend`, а трафик
    # обслуживал `levelup-academy-1` — проверено запросами:
    # levelup-backend.onrender.com/health → 404, levelup-academy-1/health → 200.
    # Из-за этого preDeployCommand и NODE_ENV ниже никогда не применялись:
    # прод отдавал /api/docs.json (200), то есть работал с NODE_ENV=development.
    # Переименовывать «покрасивее» нельзя — сначала переименуй сервис в дашборде.
    name: levelup-academy-1
    runtime: node
    rootDir: backend
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm install
    # Миграции гоняются ДО того, как новый код начнёт принимать трафик.
    # Без этого деплой поднимал свежий код поверх старой схемы: код обращался
    # к колонкам, которых в базе ещё нет, и страницы отдавали 500. Если
    # миграция упадёт — Render прервёт деплой и оставит работать прошлую
    # версию, что лучше, чем выкатить заведомо нерабочую.
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- фиксированные (не секреты) ---
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"          # Neon требует TLS
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        value: levelup
      # --- JWT: Render сгенерит сильный секрет сам ---
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # --- секреты: вводятся в дашборде Render (значения из backend/.env) ---
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # URL фронта для CORS — пока фронт не задеплоен, можно указать URL самого сервиса
      - key: CLIENT_URL
        sync: false

  # ─── Worker (BullMQ + Telegram bot + Cron) ───
  # ⚠️ Worker uchun TELEGRAM_BOT_TOKEN va TELEGRAM_CHAT_ID kerak.
  #    Render free plannerда worker ham ~15 min o'tgandan keyin uxlaydi.
  #    Shuning uchun real-time Telegram uchun paid plan kerak bo'lishi mumkin.
  - type: worker
    # ⚠️ Имя НЕ проверено (у worker'а нет HTTP-эндпоинта, снаружи не пингуется).
    # Сверить с дашбордом Render: если реальный сервис называется иначе — этот
    # блок так же не применяется, как было у web выше.
    name: levelup-worker
    runtime: node
    rootDir: backend
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm run worker
    autoDeploy: true
    envVars:
      # --- API bilan bir xil env vars ---
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        value: levelup
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLIENT_URL
        sync: false
      # --- Telegram bot (worker uchun qo'shimcha) ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
